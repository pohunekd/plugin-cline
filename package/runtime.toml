# Runtime descriptor of the Cline CLI package.
#
# Verified against Cline 3.0.74 (compat/RELEASE). Core's `cline-hook-v1`
# handler keeps every launch inside the TUI's process tree (the default mode
# attaches to a running Cline hub, or starts one that outlives the session,
# compat/hub/) and installs the reporter hooks that follow the session
# identity and its subagents. Every feature in `requires` exists from core
# 0.42.0; the minimum core is 0.44.0, the release the kit (kit/Cargo.toml) and
# the smoke ran against.

schema = 1
id = "pohunek.runtime.cline"
version = "0.1.0"
runtime_api = 1
requires = [
  "launch-env-v1",
  "input-refuse-while-blocked-v1",
  "integration-cline-hook-v1",
  "placement-v1",
  "version-probe-open-range-v1",
]

[runtime]
id = "cline"
name = "Cline CLI"
program = "cline"
# No `--auto-approve` argument: Cline's own approval setting applies, and
# Shift+Tab in a session persists that setting globally.
args = []
detect_manifest = "detect.toml"
# Typed into the composer once it is drawn: a prompt word can select a
# subcommand (`cline -i version` prints the version).
prompt_arg = false
# `cline --version` prints the release alone on stdout, also through the Node
# wrapper (compat/install/version.txt).
# Open-ended range: every release from `min` on is admitted, so a newer 3.x or
# 4.x launches without a package update; drift is caught by capturing new releases.
version_probe = { parser = "semver-v1", args = ["--version"], min = "3.0.74" }

# Compiled core handler: it sets `CLINE_SANDBOX=1` and `CLINE_SANDBOX_DATA_DIR`
# on every create and resume launch, so a session stays in the TUI process
# and keeps the user's store, and it installs the reporter into
# `<CLINE_DIR>/hooks/` (see `[config_home]`).
[integration]
handler = "cline-hook-v1"
hook_schema = "identity-subagent-v1"

# The agent runs only in its worker generation's process tree; the handler's
# launch input above is what keeps Cline from using a shared hub.
[placement]
mode = "in_process"
keep_local_handler = true

# Cline replaces its install in the background at exit (npm, pnpm, yarn and
# bun installs) unless told not to; a pinned release must not change under a
# running host. The notice variable keeps the one-time promo modals from
# taking the first key of the initial input.
[launch_env]
CLINE_NO_AUTO_UPDATE = "1"
CLINE_DISABLE_CLINE_PASS_NOTICE = "1"

# Bracketed paste is enabled before the composer draws, so only the rendered
# composer (detect rule `idle_composer`) shows that Cline reads input.
[input]
bracketed_paste = true
# The capture kit pauses 0.5 s between typed text and Enter, because an Enter
# in the same burst is read as part of the paste (scripts/capture TYPE_PAUSE);
# a shorter delay is unverified.
submit_delay_ms = 500
text_policy = "unrestricted"
ready = "screen_idle"
# The approval box takes `y`/`n` but also approves on Enter or any typed
# answer (compat/screens/approval-*), and the other dialogs take Enter as a
# choice, so text sent while one shows would answer it unseen; the operator
# answers through `pohunek attach`.
refuse_while_blocked = true

# Cline creates a session under the id given to `--id`; with a known id the
# same flag resumes it (TUI only).
[resume]
supported = true
reference_kind = "id"
args = ["--id", "{reference}"]

# Core generates the id and Cline stores the session under it. The reporter
# hooks re-bind the reference to the reported id after `/clear`, `/fork` or an
# in-TUI `/history` switch. Cline forks only inside its TUI; core 0.44.0 reads
# no `[fork]` table, so the descriptor has none.
[native_reference]
strategy = "assigned"
launch_args = ["--id", "{reference}"]

# Recovery of the reference core assigned needs the session manifest
# `<id>/<id>.json`, which Cline writes at the first prompt, below `<data root>/sessions`. The data root is
# `CLINE_DATA_DIR`, else `<config home>/data`.
[native_reference.existence]
check = "file"
root_env = "CLINE_DIR"
root_home = ".cline"
dir = "data/sessions"
file_name = "{reference}.json"
name_match = "exact"
max_depth = 1
store_env = "CLINE_DATA_DIR"
store_max_depth = 2
relocating_args = ["--data-dir", "--config"]

# `CLINE_DIR` holds hooks, plugins, agents and rules, and the data root below
# it by default.
[config_home]
env = "CLINE_DIR"
default = ".cline"
