[package]
name = "cline-plugin-kit"
version = "0.0.0"
edition = "2021"
publish = false
description = "Stand-in for the pohunek plugin kit: lints, builds and checks the Cline package against core."

[lib]
path = "src/lib.rs"

# The pin is the core release that carries `transcripts-cline-session-v1`
# (zajca/pohunek#1954), the minimum core of the package.
[dependencies]
pohunek-daemon = { git = "https://github.com/zajca/pohunek", tag = "v0.45.0" }
pohunek-package = { git = "https://github.com/zajca/pohunek", tag = "v0.45.0" }
pohunek-protocol = { git = "https://github.com/zajca/pohunek", tag = "v0.45.0" }
