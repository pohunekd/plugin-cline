name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels its older run; main runs are never
# cancelled so every merge commit gets a result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scripts:
    name: scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends tmux jq sqlite3
      - name: shellcheck
        # Pinned so CI and local runs agree; the apt package is older.
        run: |
          python3 -m venv "$RUNNER_TEMP/sc"
          "$RUNNER_TEMP/sc/bin/pip" install --quiet shellcheck-py==0.11.0.1
          "$RUNNER_TEMP/sc/bin/shellcheck" scripts/capture scripts/hook-log
      - name: model stub syntax
        run: python3 -I -c 'import ast, sys; ast.parse(open(sys.argv[1]).read())' scripts/model-stub
      - name: capture dry run
        # Tool check, redaction and id-placeholder self tests, and a loopback
        # round trip through the model stub; no network and no Cline binary.
        run: scripts/capture --root "$RUNNER_TEMP/capture" --dry-run all
      - name: evidence carries no credential or home path
        # The kit never signs in and never copies providers.json or a hub
        # discovery record; a credential-shaped string in compat/ is a bug.
        run: |
          if grep -rEIi '"(authtoken|apikey|api_key|accesstoken|refreshtoken)"[[:space:]]*:[[:space:]]*"[^"<]|Bearer [A-Za-z0-9._-]{20,}|capture-placeholder-key|POHUNEK_|/(home|Users|root)/[A-Za-z0-9._-]+' compat; then
            echo "credential or home path in compat/" >&2
            exit 1
          fi
